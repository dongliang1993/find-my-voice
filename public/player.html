<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>语音消息</title>
  <style>
    :root{color-scheme:light dark;--text:#24322b;--muted:#718078;--bubble:#e3f3dc;--hover:#d8edce;--active:#cde7c2;--error:#a33b32;--focus:#347653}
    *{box-sizing:border-box}body{margin:0;padding:12px;background:transparent;color:var(--text);font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
    .message{max-width:560px}.transcript{margin:0 0 13px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.75}
    .voice-row{display:flex;align-items:center;gap:10px;min-width:0;padding-left:5px}
    .voice-bubble{position:relative;display:flex;align-items:center;justify-content:space-between;gap:24px;width:180px;max-width:100%;min-height:48px;padding:12px 17px;border:0;border-radius:12px;background:var(--bubble);color:var(--text);font:inherit;cursor:pointer;transition:background .15s}
    .voice-bubble:before{content:"";position:absolute;left:-4px;top:18px;width:10px;height:10px;background:inherit;border-radius:2px;transform:rotate(45deg)}
    .voice-bubble:hover:enabled{background:var(--hover)}.voice-bubble:active:enabled{background:var(--active)}.voice-bubble:disabled{opacity:.55;cursor:default}.voice-bubble:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
    .voice-icon{display:block;flex:none;width:23px;height:23px}.voice-bubble.playing .voice-icon>path{animation-duration:1.2s;animation-timing-function:step-end;animation-iteration-count:infinite}.voice-bubble.playing .voice-icon>path:nth-child(1){animation-name:voice-inner}.voice-bubble.playing .voice-icon>path:nth-child(2){animation-name:voice-middle}.voice-bubble.playing .voice-icon>path:nth-child(3){animation-name:voice-outer}
    .duration{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}.badge{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
    .status{margin:9px 0 0 5px;font-size:12px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}.status:empty{display:none}.status.error{color:var(--error)}
    .download{display:inline-block;margin:6px 0 0 5px;font-size:12px;color:var(--focus)}.spoken-text{margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
    [hidden],audio{display:none!important}
    @keyframes voice-inner{0%,74.99%{opacity:1}75%,100%{opacity:.18}}
    @keyframes voice-middle{0%,24.99%{opacity:.18}25%,74.99%{opacity:1}75%,100%{opacity:.18}}
    @keyframes voice-outer{0%,49.99%{opacity:.18}50%,74.99%{opacity:1}75%,100%{opacity:.18}}
    @media(prefers-reduced-motion:reduce){.voice-bubble,.voice-icon>path{transition:none!important;animation:none!important}}
    @media(prefers-color-scheme:dark){:root{--text:#e7f1e7;--muted:#9eafa2;--bubble:#294732;--hover:#31553b;--active:#396043;--error:#f4a59b;--focus:#95c7a6}}
    @media(max-width:340px){body{padding:10px}.transcript{font-size:14px}.voice-row{gap:8px}}
  </style>
</head>
<body>
  <main class="message" aria-label="语音消息">
    <p class="transcript" id="transcript" hidden></p>
    <div class="voice-row">
      <button class="voice-bubble" id="play" type="button" aria-label="语音加载中" aria-pressed="false" disabled>
        <svg class="voice-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 10.5v3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path class="wave middle" d="M10 7.5a7 7 0 0 1 0 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path class="wave outer" d="M15 4a12 12 0 0 1 0 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="duration" id="duration" aria-hidden="true">…</span>
      </button>
      <span class="badge" id="badge" hidden></span>
    </div>
    <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
    <p class="status" id="status" role="status">等待语音…</p>
    <p class="spoken-text" id="spoken-text" hidden></p>
    <a class="download" id="download" hidden target="_blank" rel="noopener noreferrer">打开音频</a>
  </main>
  <script type="module">
    const $=id=>document.getElementById(id);
    const audio=$('audio');let data=null;let metadataReady=false;
    const validDuration=n=>Number.isFinite(n)&&n>0;
    const durationLabel=n=>validDuration(n)?`${Math.ceil(n)}″`:'…';
    const setStatus=(text,error=false)=>{$('status').textContent=text;$('status').classList.toggle('error',error)};
    function safeUrl(value){const u=new URL(value);if(u.protocol==='https:'||(u.protocol==='http:'&&['127.0.0.1','localhost','[::1]'].includes(u.hostname)))return u.href;throw new Error('音频地址无效。')}
    function updateButton(){
      const playing=!audio.paused&&!audio.ended;
      const duration=validDuration(audio.duration)?audio.duration:data?.duration_seconds;
      $('play').classList.toggle('playing',playing);$('play').setAttribute('aria-pressed',String(playing));
      const label=validDuration(duration)?`，${Math.ceil(duration)} 秒`:'';
      $('play').setAttribute('aria-label',`${playing?'暂停':'播放'}语音${label}`);
      $('duration').textContent=durationLabel(duration);
      $('play').style.width=`${validDuration(duration)?Math.min(280,140+Math.sqrt(duration)*18):180}px`;
    }
    function render(value){
      if(!value||typeof value.audio_url!=='string')return;
      try{
        const url=safeUrl(value.audio_url);
        // Repeated host notifications should not interrupt a message being played.
        if(data?.audio_url===url){data=value;return}
        audio.pause();metadataReady=false;data={...value,audio_url:url};
        $('play').disabled=true;$('play').classList.remove('playing');$('play').setAttribute('aria-pressed','false');$('play').setAttribute('aria-label','语音加载中');
        $('transcript').textContent=String(value.text||'');$('transcript').hidden=!value.text;
        $('badge').textContent=value.is_test_audio?'测试提示音':value.generation_mode==='seed-audio'?'声音实验':'';$('badge').hidden=!$('badge').textContent;
        $('spoken-text').textContent=value.spoken_text?`实际生成字幕：${value.spoken_text}`:'';$('spoken-text').hidden=!value.spoken_text;
        $('download').href=url;$('download').hidden=true;
        $('duration').textContent=durationLabel(value.duration_seconds);
        setStatus('正在加载语音…');audio.src=url;audio.load();
      }catch(error){audio.pause();$('play').disabled=true;$('play').classList.remove('playing');$('play').setAttribute('aria-pressed','false');setStatus(error.message,true)}
    }
    const ready=()=>{
      metadataReady=validDuration(audio.duration);$('play').disabled=!metadataReady;updateButton();
      if(metadataReady)setStatus(data?.is_test_audio?'这是测试提示音，不是真实语音。':data?.generation_mode==='seed-audio'?'声音实验，请核对实际台词。':'');
    };
    audio.addEventListener('loadedmetadata',ready);audio.addEventListener('durationchange',ready);
    audio.addEventListener('play',()=>{updateButton();setStatus(data?.is_test_audio?'正在播放测试提示音。':'')});
    audio.addEventListener('pause',updateButton);audio.addEventListener('ended',()=>{updateButton();setStatus(data?.is_test_audio?'这是测试提示音，不是真实语音。':'')});
    audio.addEventListener('error',()=>{$('play').disabled=true;$('play').classList.remove('playing');$('play').setAttribute('aria-pressed','false');setStatus('语音加载失败或链接已过期，请刷新音频链接。',true);$('download').hidden=!data});
    $('play').addEventListener('click',async()=>{try{if(audio.paused){if(audio.ended)audio.currentTime=0;await audio.play()}else audio.pause()}catch{setStatus('播放未能开始，请再次点击或打开音频。',true);$('download').hidden=false}});
    const apply=result=>{
      if(result?.isError){audio.pause();$('play').disabled=true;setStatus('语音生成失败，请稍后查看。',true);return}
      render(result?.structuredContent?.data||result?.data||result?.structuredContent||result);
    };
    let rpcId=0;const pending=new Map();
    const notify=(method,params)=>window.parent.postMessage({jsonrpc:'2.0',method,params},'*');
    function request(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('宿主未响应'))},5000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
    window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;
      if(pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}
      if(m.method==='ui/notifications/tool-result')apply(m.params);
    });
    if(window.parent!==window){request('ui/initialize',{appInfo:{name:'finding-my-voice-player',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>notify('ui/notifications/initialized',{})).catch(()=>{if(!data)setStatus('等待语音…')});}
    if(window.openai?.toolOutput)apply(window.openai.toolOutput);
    window.addEventListener('openai:set_globals',()=>{if(window.openai?.toolOutput)apply(window.openai.toolOutput)});
    const route=/^\/player\/([a-f0-9-]+)$/.exec(location.pathname);
    if(route){fetch(`/speech/${route[1]}${location.search}`).then(async r=>{const payload=await r.json();if(!r.ok)throw new Error(payload.error?.message||'音频链接不可用。');return payload}).then(render).catch(e=>setStatus(e.message,true));}
  </script>
</body>
</html>
