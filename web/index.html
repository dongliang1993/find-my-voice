<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <title>Find My Voice</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Same rules as src/lib/theme.ts, before first paint, so a cream page never flashes black.
      // The loading gate comes first and follows her hour: dark from 19:40 to 3:24, where
      // the room's colour in features/stage/ambient.ts crosses into dark.
      try {
        var t = localStorage.getItem('fmv-theme') === 'radio' ? 'radio' : 'her';
        var now = new Date(), h = now.getHours() + now.getMinutes() / 60;
        var d = t === 'radio' || h >= 19 + 40 / 60 || h < 3 + 24 / 60;
        document.documentElement.dataset.theme = t;
        if (d) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@0..100,100..900&family=Space+Grotesk:wght@400..600&family=Space+Mono:wght@400;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Inter+Tight:wght@300..500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
