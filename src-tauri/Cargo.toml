[package]
name = "find-my-voice"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[lib]
name = "find_my_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
